    const { useState, useEffect, useRef } = React;

    // ===== 自作SVGチャート =====
    // series: [{ key, color, highlight }, ...] でマルチシリーズ表示
    // 後方互換性: dataKey + color を渡すとシングルシリーズとして動作
    function SimpleChart({ data, dataKey, color, series, refLine, height = 200 }) {
      const containerRef = useRef(null);
      const [width, setWidth] = useState(360);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        const update = () => {
          const w = el.getBoundingClientRect().width;
          if (w > 0) setWidth(Math.floor(w));
        };
        update();
        const ro = new ResizeObserver(update);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // シリーズ正規化:singleでもmultiでも同じ形式に
      const seriesList = series && series.length > 0
        ? series
        : [{ key: dataKey, color: color, highlight: true }];

      if (!data || data.length < 2) {
        return (
          <div ref={containerRef} style={{ height }} className="flex items-center justify-center text-zinc-700 text-xs">
            データ収集中...
          </div>
        );
      }

      // 全シリーズの値を集めて min/max を算出
      let allValues = [];
      seriesList.forEach(s => {
        data.forEach(d => {
          if (d[s.key] !== undefined) allValues.push(d[s.key]);
        });
      });
      if (refLine) allValues.push(refLine);

      const min = Math.min(...allValues);
      const max = Math.max(...allValues);
      const range = max - min || 1;
      const padding = range * 0.1;
      const chartMin = min - padding;
      const chartMax = max + padding;
      const chartRange = chartMax - chartMin;

      const w = width;
      const h = height;
      const padX = 44;
      const padY = 12;
      const innerW = w - padX - 8;
      const innerH = h - padY * 2;

      const toY = (v) => padY + (1 - (v - chartMin) / chartRange) * innerH;
      const toX = (i) => padX + (i / (data.length - 1)) * innerW;

      const yLabels = [chartMax, (chartMax + chartMin) / 2, chartMin].map(v => ({
        value: v,
        y: toY(v)
      }));

      return (
        <div ref={containerRef} style={{ width: '100%', height }}>
          <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
            {/* グリッド */}
            {yLabels.map((label, i) => (
              <line key={'g' + i} x1={padX} y1={label.y} x2={w - 8} y2={label.y} stroke="#27272a" strokeWidth="0.5" />
            ))}
            {/* Y軸ラベル */}
            {yLabels.map((label, i) => (
              <text key={'l' + i} x={padX - 4} y={label.y + 3} fill="#52525b" fontSize="9" textAnchor="end" fontFamily="JetBrains Mono, monospace">
                {Math.floor(label.value)}
              </text>
            ))}
            {/* 取得単価ライン(individual時のみ refLine が来る) */}
            {refLine && (
              <line x1={padX} y1={toY(refLine)} x2={w - 8} y2={toY(refLine)} stroke="#fbbf24" strokeWidth="1" strokeDasharray="3 3" opacity="0.7" />
            )}
            {/* 各シリーズを描画(highlight=falseを先に、trueを後に重ねる) */}
            {[...seriesList].sort((a, b) => (a.highlight ? 1 : 0) - (b.highlight ? 1 : 0)).map(s => {
              const path = data
                .filter(d => d[s.key] !== undefined)
                .map((d, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(d[s.key]).toFixed(1)}`)
                .join(' ');
              const last = data[data.length - 1];
              return (
                <g key={s.key}>
                  <path
                    d={path}
                    fill="none"
                    stroke={s.color}
                    strokeWidth={s.highlight ? 2 : 1}
                    strokeLinejoin="round"
                    strokeLinecap="round"
                    opacity={s.highlight ? 1 : 0.55}
                  />
                  {last && last[s.key] !== undefined && (
                    <circle
                      cx={toX(data.length - 1)}
                      cy={toY(last[s.key])}
                      r={s.highlight ? 3 : 2}
                      fill={s.color}
                      opacity={s.highlight ? 1 : 0.7}
                    />
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

      // ITウルトラ只野コーポレーション(高リスク)
      { stock: 'ultra', impact: 0.18, text: '只野社長、気まぐれで子会社を売却。「面白そうだったから(本人談)」', positive: true },
      { stock: 'ultra', impact: -0.15, text: '只野社長、深夜にXで「会社辞めるかも」とつぶやき株価暴落', positive: false },

    // ===== カスタム銘柄用 リスク別ニューステンプレート =====
    const NEWS_TEMPLATES = {
      low: [

      ],

        { impact: 0.32, text: '[NAME]、社長がX(旧Twitter)で「月行く」とつぶやき株価2倍🚀', positive: true },
        { impact: -0.28, text: '[NAME]社長、競合他社の社長と公開ケンカ。場外乱闘で警察沙汰', positive: false },
        { impact: 0.25, text: '[NAME]、謎の覆面投資家が大量買い。「直感(本人談)」🌙', positive: true },
        { impact: -0.22, text: '[NAME]社長、占い師の助言で本社移転を発表。投資家困惑', positive: false },
        { impact: 0.30, text: '[NAME]、創業者の犬が新CEOに就任。なぜか業績爆上がり🐕', positive: true },
        { impact: -0.30, text: '[NAME]、全社員が同時退職。理由は「なんとなく」', positive: false },
      ]

    // カスタム銘柄用ティッカー自動生成(銘柄名からアルファベット抽出 or 連番)
    function generateTicker(name, index) {
      const ascii = name.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      if (ascii.length >= 3) return ascii.slice(0, 4);
      return 'STK' + (index + 1);
    }

    const MARKET_EVENTS = [
      { type: 'crash', impact: -0.08, text: '⚠️ 突然の市場パニック!原因は誰かのデマツイート', duration: 5 },
      { type: 'bubble', impact: 0.06, text: '🎉 謎のお祭りムード到来!理由不明だが買い殺到', duration: 5 },
      { type: 'rate_up', impact: -0.04, text: '📉 中央銀行総裁、利上げを発表。株式に冷や水', duration: 4 },
      { type: 'rate_down', impact: 0.04, text: '📈 中央銀行が利下げ、市場は歓喜', duration: 4 },
      { type: 'meme', impact: 0.07, text: '🔥 SNSでミーム拡散!とにかく買い時らしい', duration: 4 },
      { type: 'fud', impact: -0.06, text: '💀 著名アナリストが「終わりの始まり」と警告', duration: 4 },
    ];

    const INITIAL_CASH = 1000000;
    const GAME_OVER_THRESHOLD = -300000;
    const TICK_INTERVAL = 500;
    const NEWS_CHANCE = 0.04;
    const MARKET_EVENT_CHANCE = 0.015;
    const TIME_LIMIT_TICKS = 360; // ノーマルモードの3分(0.5秒×360)

    function TradeGame() {
      const [phase, setPhase] = useState('start'); // start, customSetup, playing, gameover, timeup
      const [mode, setMode] = useState('normal'); // normal | custom
      const [customTimeLimit, setCustomTimeLimit] = useState(360); // カスタム時の制限tick数
      const [customStocks, setCustomStocks] = useState([
        { name: '銘柄1', risk: 'low' },
        { name: '銘柄2', risk: 'mid' },
        { name: '銘柄3', risk: 'high' },
      ]);
      const [activeStocks, setActiveStocks] = useState(STOCKS); // 実際にゲームで使う銘柄(オブジェクト形式)
      const [leverage, setLeverage] = useState(1);
      const [cash, setCash] = useState(INITIAL_CASH);
      const [borrowed, setBorrowed] = useState(0);
      const [holdings, setHoldings] = useState({});
      const [avgCost, setAvgCost] = useState({});
      const [prices, setPrices] = useState({});
      const [priceHistory, setPriceHistory] = useState([]);
      const [tick, setTick] = useState(0);
      const [selectedStock, setSelectedStock] = useState('soga');
      const [tradeAmount, setTradeAmount] = useState(100000);
      const [news, setNews] = useState([]);
      const [marketEvent, setMarketEvent] = useState(null);
      const [highScore, setHighScore] = useState(INITIAL_CASH);
      const [flash, setFlash] = useState(null);
      const [newsPanelOpen, setNewsPanelOpen] = useState(false);
      const [unreadNews, setUnreadNews] = useState(0);
      const [toast, setToast] = useState(null);
      const [chartMode, setChartMode] = useState('individual'); // individual | all
      const [hiddenSeries, setHiddenSeries] = useState({}); // { stockKey: true } で非表示

      const tickRef = useRef(0);
      const touchStartX = useRef(null);

      // 銘柄キーリスト
      const stockKeys = Object.keys(activeStocks);
      // 現在のゲームに使う制限時間(モードで切り替え)
      const effectiveTimeLimit = mode === 'custom' ? customTimeLimit : TIME_LIMIT_TICKS;

      // 時間が長いほど難易度UP(緩くならないように)
      const difficulty = (() => {
        if (effectiveTimeLimit <= 360) {
          // 3分以下:標準
          return { volMult: 1.0, newsRate: NEWS_CHANCE, marketRate: MARKET_EVENT_CHANCE };
        } else if (effectiveTimeLimit <= 600) {
          // 5分:やや高密度
          return { volMult: 1.15, newsRate: 0.07, marketRate: 0.025 };
        } else {
          // 10分:高密度モード
          return { volMult: 1.3, newsRate: 0.08, marketRate: 0.03 };
        }
      })();

      const totalAssets =
        cash +
        stockKeys.reduce((sum, key) => sum + (holdings[key] || 0) * (prices[key] || 0), 0) -
        borrowed;

      useEffect(() => {
        if (phase !== 'playing') return;

        const interval = setInterval(() => {
          tickRef.current += 1;
          setTick(tickRef.current);

          setPrices(prev => {
            const next = { ...prev };
            stockKeys.forEach(key => {
              const stock = activeStocks[key];
              const random = (Math.random() - 0.5) * 2;
              let change = stock.drift + random * stock.volatility * difficulty.volMult;
              if (marketEvent) {
                change += marketEvent.impact / marketEvent.duration;
              }
              next[key] = Math.max(10, prev[key] * (1 + change));
            });
            return next;
          });

          if (Math.random() < difficulty.newsRate) {
            // モードで使うニュースを切り替え
            let event;
            if (mode === 'normal') {
              const nev = NEWS_EVENTS[Math.floor(Math.random() * NEWS_EVENTS.length)];
              event = { ...nev };
            } else {
              // カスタム:ランダムで銘柄を選び、リスク度に応じたテンプレートを選ぶ
              const targetKey = stockKeys[Math.floor(Math.random() * stockKeys.length)];
              const targetStock = activeStocks[targetKey];
              const templates = NEWS_TEMPLATES[targetStock.risk];
              const tpl = templates[Math.floor(Math.random() * templates.length)];
              event = {
                stock: targetKey,
                impact: tpl.impact,
                text: tpl.text.replace('[NAME]', targetStock.name),
                positive: tpl.positive
              };
            }
            setPrices(prev => ({
              ...prev,
              [event.stock]: prev[event.stock] * (1 + event.impact)
            }));
            const newsItem = { id: Date.now(), text: event.text, positive: event.positive, tick: tickRef.current };
            setNews(prev => [newsItem, ...prev].slice(0, 20));
            setToast({ ...newsItem, isMarket: false });
            if (!newsPanelOpen) setUnreadNews(n => n + 1);
          }

          if (!marketEvent && Math.random() < difficulty.marketRate) {
            const event = MARKET_EVENTS[Math.floor(Math.random() * MARKET_EVENTS.length)];
            setMarketEvent({ ...event, remaining: event.duration });
            const newsItem = { id: Date.now(), text: event.text, positive: event.impact > 0, tick: tickRef.current, isMarket: true };
            setNews(prev => [newsItem, ...prev].slice(0, 20));
            setToast(newsItem);
            if (!newsPanelOpen) setUnreadNews(n => n + 1);
          } else if (marketEvent) {
            setMarketEvent(prev => {
              if (!prev) return null;
              const remaining = prev.remaining - 1;
              if (remaining <= 0) return null;
              return { ...prev, remaining };
            });
          }
        }, TICK_INTERVAL);

        return () => clearInterval(interval);
      }, [phase, marketEvent, newsPanelOpen, mode, activeStocks]);

      // トースト自動消去
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => {
          setToast(prev => (prev && prev.id === toast.id) ? null : prev);
        }, 5000);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        if (phase !== 'playing') return;
        setPriceHistory(prev => [
          ...prev,
          { tick, ...prices }
        ].slice(-80));
      }, [tick, phase]);

      useEffect(() => {
        if (phase !== 'playing') return;
        if (totalAssets > highScore) setHighScore(totalAssets);
        if (totalAssets < GAME_OVER_THRESHOLD) {
          setPhase('gameover');
        } else if (tick >= effectiveTimeLimit) {
          let finalCash = cash;
          let finalBorrowed = borrowed;
          stockKeys.forEach(key => {
            if (holdings[key] > 0) {
              const proceeds = holdings[key] * prices[key];
              if (finalBorrowed > 0) {
                const repay = Math.min(finalBorrowed, proceeds);
                finalBorrowed -= repay;
                finalCash += proceeds - repay;
              } else {
                finalCash += proceeds;
              }
            }
          });
          setCash(finalCash);
          setBorrowed(finalBorrowed);
          // 全銘柄を0でリセット
          const zeroHoldings = {};
          stockKeys.forEach(k => zeroHoldings[k] = 0);
          setHoldings(zeroHoldings);
          setPhase('timeup');
        }
      }, [totalAssets, phase, tick, effectiveTimeLimit]);

      // ノーマルモード開始
      const startNormalGame = () => {
        setMode('normal');
        setActiveStocks(STOCKS);
        const keys = Object.keys(STOCKS);
        const initPrices = {};
        const initHoldings = {};
        const initAvg = {};
        keys.forEach(k => {
          initPrices[k] = STOCKS[k].initialPrice;
          initHoldings[k] = 0;
          initAvg[k] = 0;
        });
        setPrices(initPrices);
        setHoldings(initHoldings);
        setAvgCost(initAvg);
        setSelectedStock(keys[0]);
        resetGameState();
        setPhase('playing');
      };

      // カスタムモード開始(設定済みのcustomStocksから生成)
      const startCustomGame = () => {
        const newStocks = {};
        const initPrices = {};
        const initHoldings = {};
        const initAvg = {};
        customStocks.forEach((s, i) => {
          const key = 'custom_' + i;
          const preset = RISK_PRESETS[s.risk];
          // 初期価格は500〜1500のランダムで決める
          const initPrice = 500 + Math.floor(Math.random() * 1000);
          newStocks[key] = {
            name: s.name || ('銘柄' + (i + 1)),
            ticker: generateTicker(s.name, i),
            initialPrice: initPrice,
            volatility: preset.volatility,
            drift: preset.drift,
            color: preset.color,
            desc: preset.desc,
            risk: s.risk
          };
          initPrices[key] = initPrice;
          initHoldings[key] = 0;
          initAvg[key] = 0;
        });
        setMode('custom');
        setActiveStocks(newStocks);
        setPrices(initPrices);
        setHoldings(initHoldings);
        setAvgCost(initAvg);
        setSelectedStock(Object.keys(newStocks)[0]);
        resetGameState();
        setPhase('playing');
      };

      // ゲーム共通リセット処理
      const resetGameState = () => {
        setCash(INITIAL_CASH);
        setBorrowed(0);
        setPriceHistory([]);
        setNews([]);
        setMarketEvent(null);
        setHighScore(INITIAL_CASH);
        setUnreadNews(0);
        tickRef.current = 0;
        setTick(0);
      };

      const handleBuy = () => {
        const price = prices[selectedStock];
        const cost = tradeAmount;
        const buyingPower = cash * leverage;
        if (cost > buyingPower) {
          setFlash({ text: '購買力不足', error: true });
          setTimeout(() => setFlash(null), 1200);
          return;
        }
        const shares = cost / price;
        const oldShares = holdings[selectedStock];
        const newShares = oldShares + shares;
        const newAvg = (oldShares * avgCost[selectedStock] + cost) / newShares;
        setAvgCost(prev => ({ ...prev, [selectedStock]: newAvg }));
        setHoldings(prev => ({ ...prev, [selectedStock]: newShares }));

        if (cost <= cash) {
          setCash(c => c - cost);
        } else {
          const fromBorrow = cost - cash;
          setCash(0);
          setBorrowed(b => b + fromBorrow);
        }
        setFlash({ text: `+${shares.toFixed(2)}株`, error: false });
        setTimeout(() => setFlash(null), 1200);
      };

      const handleSell = () => {
        const price = prices[selectedStock];
        const shares = holdings[selectedStock];
        if (shares <= 0) {
          setFlash({ text: '保有なし', error: true });
          setTimeout(() => setFlash(null), 1200);
          return;
        }
        const proceeds = shares * price;
        let remaining = proceeds;
        if (borrowed > 0) {
          const repay = Math.min(borrowed, remaining);
          setBorrowed(b => b - repay);
          remaining -= repay;
        }
        setCash(c => c + remaining);
        setHoldings(prev => ({ ...prev, [selectedStock]: 0 }));
        setAvgCost(prev => ({ ...prev, [selectedStock]: 0 }));
        setFlash({ text: `¥${Math.floor(proceeds).toLocaleString()}`, error: false });
        setTimeout(() => setFlash(null), 1200);
      };

      const openNews = () => {
        setNewsPanelOpen(true);
        setUnreadNews(0);
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };
      const handleTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (diff > 60 && !newsPanelOpen) {
          openNews();
        } else if (diff < -60 && newsPanelOpen) {
          setNewsPanelOpen(false);
        }
        touchStartX.current = null;
      };

      // ===== スタート画面 =====
      if (phase === 'start') {
        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col p-5">
            <div className="flex-1 flex flex-col justify-center">
              <div className="border-l-4 border-amber-400 pl-4 mb-8">
                <div className="text-amber-400 text-[10px] tracking-[0.3em] mb-2">SESSA TRADING SYSTEM v0.2</div>
                <h1 className="text-4xl font-black tracking-tight leading-tight">SESSA<br/><span className="text-amber-400">Trading</span></h1>
                <div className="text-zinc-500 text-xs mt-3">3分間の取引、生き残れるか。</div>
              </div>

              <div className="space-y-5">
                {/* モード選択 */}
                <div>
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-3">SELECT MODE</div>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setMode('normal')}
                      className={`py-4 border-2 transition-all ${mode === 'normal' ? 'border-amber-400 bg-amber-400/10 text-amber-400' : 'border-zinc-800 text-zinc-400'}`}
                    >
                      <div className="text-base font-black">NORMAL</div>
                      <div className="text-[9px] tracking-widest mt-1">3銘柄プリセット</div>
                    </button>
                    <button
                      onClick={() => setMode('custom')}
                      className={`py-4 border-2 transition-all ${mode === 'custom' ? 'border-amber-400 bg-amber-400/10 text-amber-400' : 'border-zinc-800 text-zinc-400'}`}
                    >
                      <div className="text-base font-black">CUSTOM</div>
                      <div className="text-[9px] tracking-widest mt-1">自分で銘柄作成</div>
                    </button>
                  </div>
                </div>

                {/* レバレッジ選択 */}
                <div>
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-3">SELECT LEVERAGE</div>
                  <div className="grid grid-cols-3 gap-2">
                    {[1, 3, 5].map(lev => (
                      <button
                        key={lev}
                        onClick={() => setLeverage(lev)}
                        className={`py-5 border-2 transition-all ${
                          leverage === lev
                            ? 'border-amber-400 bg-amber-400/10 text-amber-400'
                            : 'border-zinc-800 text-zinc-400'
                        }`}
                      >
                        <div className="text-2xl font-black">×{lev}</div>
                        <div className="text-[9px] tracking-widest mt-1">
                          {lev === 1 ? 'SAFE' : lev === 3 ? 'BALANCED' : 'AGGRESSIVE'}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-zinc-900/50 border border-zinc-800 p-4 text-xs space-y-2">
                  <div className="flex justify-between"><span className="text-zinc-500">制限時間</span><span className="text-amber-400">3:00</span></div>
                  <div className="flex justify-between"><span className="text-zinc-500">初期資金</span><span>¥{INITIAL_CASH.toLocaleString()}</span></div>
                  <div className="flex justify-between"><span className="text-zinc-500">破産ライン</span><span className="text-red-400">¥{GAME_OVER_THRESHOLD.toLocaleString()}</span></div>
                  <div className="flex justify-between"><span className="text-zinc-500">購買力</span><span className="text-amber-400">¥{(INITIAL_CASH * leverage).toLocaleString()}</span></div>
                </div>
              </div>
            </div>

            <button
              onClick={() => mode === 'normal' ? startNormalGame() : setPhase('customSetup')}
              className="w-full py-5 bg-amber-400 text-zinc-950 font-black tracking-widest active:bg-amber-500 mb-20"
            >
              {mode === 'normal' ? 'ENTER MARKET →' : 'CUSTOMIZE →'}
            </button>
          </div>
        );
      }

      // ===== カスタム設定画面 =====
      if (phase === 'customSetup') {
        const updateStock = (i, field, value) => {
          setCustomStocks(prev => prev.map((s, idx) => idx === i ? { ...s, [field]: value } : s));
        };
        const addStock = () => {
          if (customStocks.length >= 5) return;
          setCustomStocks(prev => [...prev, { name: '銘柄' + (prev.length + 1), risk: 'mid' }]);
        };
        const removeStock = (i) => {
          if (customStocks.length <= 1) return;
          setCustomStocks(prev => prev.filter((_, idx) => idx !== i));
        };

        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col p-5">
            <div className="border-l-4 border-amber-400 pl-4 mb-5">
              <div className="text-amber-400 text-[10px] tracking-[0.3em] mb-2">// CUSTOM SETUP</div>
              <h1 className="text-2xl font-black tracking-tight">銘柄をカスタマイズ</h1>
              <div className="text-zinc-500 text-xs mt-2">1〜5銘柄、それぞれ名前とリスク度を設定</div>
            </div>

            {/* 制限時間選択 */}
            <div className="mb-4">
              <div className="text-[10px] tracking-widest text-zinc-500 mb-2">TIME LIMIT</div>
              <div className="grid grid-cols-4 gap-1.5">
                {[
                  { ticks: 120, label: '1:00' },
                  { ticks: 360, label: '3:00' },
                  { ticks: 600, label: '5:00' },
                  { ticks: 1200, label: '10:00' },
                ].map(opt => (
                  <button
                    key={opt.ticks}
                    onClick={() => setCustomTimeLimit(opt.ticks)}
                    className={`py-3 text-sm font-bold border-2 transition-all ${
                      customTimeLimit === opt.ticks
                        ? 'border-amber-400 bg-amber-400/10 text-amber-400'
                        : 'border-zinc-800 text-zinc-500'
                    }`}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3 mb-4">
              {customStocks.map((s, i) => {
                const preset = RISK_PRESETS[s.risk];
                return (
                  <div key={i} className="border-2 border-zinc-800 p-3 space-y-2" style={{ borderLeftColor: preset.color, borderLeftWidth: 4 }}>
                    <div className="flex items-center gap-2">
                      <div className="text-[10px] text-zinc-500 tracking-widest">#{i + 1}</div>
                      <input
                        type="text"
                        value={s.name}
                        maxLength={20}
                        onChange={(e) => updateStock(i, 'name', e.target.value)}
                        placeholder="銘柄名"
                        className="flex-1 bg-zinc-900 border border-zinc-800 px-2 py-2 text-sm focus:outline-none focus:border-amber-400"
                        style={{ fontFamily: "'JetBrains Mono', 'Courier New', monospace" }}
                      />
                      {customStocks.length > 1 && (
                        <button
                          onClick={() => removeStock(i)}
                          className="w-9 h-9 border border-zinc-800 text-zinc-500 active:border-red-500 active:text-red-500"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-4 gap-1">
                      {Object.keys(RISK_PRESETS).map(rk => {
                        const rp = RISK_PRESETS[rk];
                        return (
                          <button
                            key={rk}
                            onClick={() => updateStock(i, 'risk', rk)}
                            className={`py-2 text-xs font-bold border-2 transition-all ${
                              s.risk === rk ? 'bg-zinc-800' : 'border-zinc-800 text-zinc-500'
                            }`}
                            style={s.risk === rk ? { borderColor: rp.color, color: rp.color } : {}}
                          >
                            {rp.label}
                          </button>
                        );
                      })}
                    </div>
                    <div className="text-[10px] text-zinc-500">{preset.desc}</div>
                  </div>
                );
              })}

              {customStocks.length < 5 && (
                <button
                  onClick={addStock}
                  className="w-full py-3 border-2 border-dashed border-zinc-800 text-zinc-500 text-sm active:border-amber-400 active:text-amber-400"
                >
                  + 銘柄を追加 ({customStocks.length}/5)
                </button>
              )}
            </div>

            <div className="grid grid-cols-2 gap-2 mb-20">
              <button
                onClick={() => setPhase('start')}
                className="py-4 border-2 border-zinc-800 text-zinc-400 font-bold tracking-widest active:bg-zinc-900"
              >
                ← BACK
              </button>
              <button
                onClick={startCustomGame}
                className="py-4 bg-amber-400 text-zinc-950 font-black tracking-widest active:bg-amber-500"
              >
                START →
              </button>
            </div>
          </div>
        );
      }


      // ===== 時間切れ画面 =====
      if (phase === 'timeup') {
        const profit = totalAssets - INITIAL_CASH;
        const profitPercent = (profit / INITIAL_CASH) * 100;
        const isWin = profit > 0;
        const rank = profitPercent >= 100 ? 'S' : profitPercent >= 50 ? 'A' : profitPercent >= 20 ? 'B' : profitPercent >= 0 ? 'C' : profitPercent >= -20 ? 'D' : 'E';
        const rankColor = rank === 'S' ? 'text-amber-400' : rank === 'A' ? 'text-emerald-400' : rank === 'B' ? 'text-blue-400' : rank === 'C' ? 'text-zinc-300' : 'text-red-400';
        const comment = rank === 'S' ? '伝説のトレーダー' : rank === 'A' ? '優秀な成績' : rank === 'B' ? '安定した運用' : rank === 'C' ? '無難な結果' : rank === 'D' ? '損失あり' : '大幅損失';

        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col p-5">
            <div className="flex-1 flex flex-col justify-center">
              <div className={`border-l-4 pl-4 mb-8 ${isWin ? 'border-amber-400' : 'border-zinc-500'}`}>
                <div className={`text-[10px] tracking-[0.3em] mb-2 ${isWin ? 'text-amber-400' : 'text-zinc-500'}`}>// SESSION COMPLETE</div>
                <h1 className={`text-5xl font-black tracking-tight ${isWin ? 'text-amber-400' : 'text-zinc-300'}`}>TIME UP</h1>
                <div className="text-zinc-500 text-xs mt-2">{Math.round(effectiveTimeLimit * TICK_INTERVAL / 60000 * 10) / 10}分間の取引が終了しました。</div>
              </div>

              <div className="border-2 border-zinc-800 p-5 mb-3 flex items-center justify-between">
                <div>
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-1">RANK</div>
                  <div className="text-xs text-zinc-400">{comment}</div>
                </div>
                <div className={`text-6xl font-black ${rankColor}`}>{rank}</div>
              </div>

              <div className="space-y-2 mb-6">
                <div className="border border-zinc-800 p-4">
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-1">FINAL ASSETS</div>
                  <div className={`text-2xl font-black ${isWin ? 'text-amber-400' : 'text-red-400'}`}>¥{Math.floor(totalAssets).toLocaleString()}</div>
                  <div className={`text-xs mt-1 ${isWin ? 'text-emerald-400' : 'text-red-400'}`}>
                    {profit >= 0 ? '+' : ''}¥{Math.floor(profit).toLocaleString()} ({profitPercent >= 0 ? '+' : ''}{profitPercent.toFixed(1)}%)
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="border border-zinc-800 p-3">
                    <div className="text-[10px] tracking-widest text-zinc-500 mb-1">PEAK</div>
                    <div className="text-base font-black text-amber-400">¥{Math.floor(highScore).toLocaleString()}</div>
                  </div>
                  <div className="border border-zinc-800 p-3">
                    <div className="text-[10px] tracking-widest text-zinc-500 mb-1">LEVERAGE</div>
                    <div className="text-base font-black">×{leverage}</div>
                  </div>
                </div>
              </div>
            </div>

            <button
              onClick={() => setPhase('start')}
              className="w-full py-5 bg-amber-400 text-zinc-950 font-black tracking-widest active:bg-amber-500 mb-20"
            >
              PLAY AGAIN →
            </button>
          </div>
        );
      }

      // ===== ゲームオーバー(破産) =====
      if (phase === 'gameover') {
        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col p-5">
            <div className="flex-1 flex flex-col justify-center">
              <div className="border-l-4 border-red-500 pl-4 mb-8">
                <div className="text-red-500 text-[10px] tracking-[0.3em] mb-2">// SYSTEM MESSAGE</div>
                <h1 className="text-5xl font-black tracking-tight text-red-500">BANKRUPT</h1>
                <div className="text-zinc-500 text-xs mt-2">市場から退場しました。</div>
              </div>

              <div className="space-y-3 mb-6">
                <div className="border border-zinc-800 p-4">
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-1">FINAL ASSETS</div>
                  <div className="text-2xl font-black text-red-400">¥{Math.floor(totalAssets).toLocaleString()}</div>
                </div>
                <div className="border border-zinc-800 p-4">
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-1">PEAK ASSETS</div>
                  <div className="text-2xl font-black text-amber-400">¥{Math.floor(highScore).toLocaleString()}</div>
                </div>
                <div className="border border-zinc-800 p-4">
                  <div className="text-[10px] tracking-widest text-zinc-500 mb-1">SURVIVED</div>
                  <div className="text-2xl font-black">{tick} TICKS</div>
                </div>
              </div>
            </div>

            <button
              onClick={() => setPhase('start')}
              className="w-full py-5 bg-amber-400 text-zinc-950 font-black tracking-widest active:bg-amber-500 mb-20"
            >
              TRY AGAIN →
            </button>
          </div>
        );
      }

      // ===== プレイ画面 =====
      const stock = activeStocks[selectedStock];
      const profitLoss = holdings[selectedStock] > 0
        ? (prices[selectedStock] - avgCost[selectedStock]) * holdings[selectedStock]
        : 0;
      const profitLossPercent = holdings[selectedStock] > 0 && avgCost[selectedStock] > 0
        ? ((prices[selectedStock] - avgCost[selectedStock]) / avgCost[selectedStock]) * 100
        : 0;

      const remaining = Math.max(0, effectiveTimeLimit - tick);
      const seconds = Math.ceil(remaining * TICK_INTERVAL / 1000);
      const mm = Math.floor(seconds / 60);
      const ss = seconds % 60;
      const isWarning = remaining <= 60;
      const isCritical = remaining <= 20;
      const progress = (remaining / effectiveTimeLimit) * 100;

      return (
        <div
          className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col relative overflow-hidden"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          {/* ヘッダー */}
          <div className="px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
            <div>
              <div className="text-[9px] text-zinc-500 tracking-widest">TOTAL ASSETS · ×{leverage}</div>
              <div className={`text-xl font-black ${totalAssets >= INITIAL_CASH ? 'text-amber-400' : 'text-red-400'}`}>
                ¥{Math.floor(totalAssets).toLocaleString()}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <div className="text-right">
                <div className="text-[9px] text-zinc-500 tracking-widest">TIME LEFT</div>
                <div className={`text-xl font-black tabular-nums ${isCritical ? 'text-red-500 animate-pulse' : isWarning ? 'text-amber-400' : 'text-zinc-100'}`}>
                  {mm}:{String(ss).padStart(2, '0')}
                </div>
                <div className="w-20 h-1 bg-zinc-800 mt-1 overflow-hidden">
                  <div
                    className={`h-full transition-all ${isCritical ? 'bg-red-500' : isWarning ? 'bg-amber-400' : 'bg-emerald-400'}`}
                    style={{ width: `${progress}%` }}
                  />
                </div>
              </div>
              <button
                onClick={openNews}
                className="relative w-12 h-12 border-2 border-zinc-800 active:border-amber-400 flex items-center justify-center"
              >
                <span className="text-lg">📰</span>
                {unreadNews > 0 && (
                  <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">
                    {unreadNews > 9 ? '9+' : unreadNews}
                  </span>
                )}
              </button>
            </div>
          </div>

          {/* 現金・借入バー */}
          <div className="px-4 py-2 border-b border-zinc-800 grid grid-cols-2 gap-2 text-xs">
            <div className="flex items-baseline gap-2">
              <span className="text-[9px] text-zinc-500 tracking-widest">CASH</span>
              <span className="text-emerald-400 font-bold tabular-nums">
                ¥{Math.floor(cash).toLocaleString()}
              </span>
            </div>
            <div className="flex items-baseline gap-2 justify-end">
              {borrowed > 0 ? (
                <>
                  <span className="text-[9px] text-red-400/70 tracking-widest">DEBT</span>
                  <span className="text-red-400 font-bold tabular-nums">
                    ¥{Math.floor(borrowed).toLocaleString()}
                  </span>
                </>
              ) : (
                <>
                  <span className="text-[9px] text-zinc-500 tracking-widest">BUYING POWER</span>
                  <span className="text-amber-400 font-bold tabular-nums">
                    ¥{Math.floor(cash * leverage).toLocaleString()}
                  </span>
                </>
              )}
            </div>
          </div>

          {/* マーケットイベント進行中ステータス */}
          {marketEvent && (
            <div className={`px-4 py-1.5 text-[10px] border-b flex justify-between items-center ${marketEvent.impact > 0 ? 'border-emerald-400/40 bg-emerald-400/5 text-emerald-400' : 'border-red-500/40 bg-red-500/5 text-red-400'}`}>
              <span className="tracking-widest">{marketEvent.impact > 0 ? '▲ MARKET BOOM' : '▼ MARKET PANIC'}</span>
              <span className="text-zinc-500">残り{marketEvent.remaining}tick</span>
            </div>
          )}

          {/* 銘柄スイッチャー(横スクロール対応タブ) */}
          <div className="px-4 py-2 border-b border-zinc-800">
            <div className="text-[9px] tracking-widest text-zinc-500 mb-1.5">MARKET</div>
            <div className="flex gap-1.5 overflow-x-auto -mx-4 px-4 pb-1" style={{ scrollbarWidth: 'thin' }}>
              {Object.keys(activeStocks).map(key => {
                const s = activeStocks[key];
                const isSelected = key === selectedStock;
                const has = holdings[key] > 0;
                return (
                  <button
                    key={key}
                    onClick={() => setSelectedStock(key)}
                    className={`flex-shrink-0 px-3 py-2 border-2 transition-all text-left ${
                      isSelected ? 'border-amber-400 bg-amber-400/10' : 'border-zinc-800 bg-zinc-900/50'
                    }`}
                    style={{ minWidth: 110 }}
                  >
                    <div className="flex items-center gap-1">
                      <div className="text-[9px] text-zinc-500 tracking-widest">{s.ticker}</div>
                      {has && <div className="w-1.5 h-1.5 rounded-full bg-amber-400"></div>}
                    </div>
                    <div className="text-[11px] font-bold truncate" style={{ maxWidth: 100, color: isSelected ? s.color : '#d4d4d8' }}>
                      {s.name}
                    </div>
                    <div className="text-xs font-bold tabular-nums" style={{ color: s.color }}>
                      ¥{prices[key].toFixed(0)}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* 価格表示 */}
          <div className="px-4 py-3 flex items-baseline justify-between">
            <div>
              <div className="text-[9px] text-zinc-500 tracking-widest">{stock.ticker}</div>
              <div className="text-3xl font-black" style={{ color: stock.color }}>
                ¥{prices[selectedStock].toFixed(0)}
              </div>
            </div>
            {holdings[selectedStock] > 0 && (
              <div className="text-right">
                <div className="text-[9px] text-zinc-500 tracking-widest">P&L</div>
                <div className={`text-lg font-bold ${profitLoss >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                  {profitLoss >= 0 ? '+' : ''}¥{Math.floor(profitLoss).toLocaleString()}
                </div>
                <div className={`text-[10px] ${profitLoss >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                  ({profitLossPercent >= 0 ? '+' : ''}{profitLossPercent.toFixed(2)}%)
                </div>
              </div>
            )}
          </div>

          {/* チャート */}
          <div className="px-2">
            {/* モード切替トグル */}
            <div className="flex justify-end px-2 mb-1">
              <div className="inline-flex border border-zinc-800 text-[9px] tracking-widest">
                <button
                  onClick={() => setChartMode('individual')}
                  className={`px-2 py-1 ${chartMode === 'individual' ? 'bg-amber-400 text-zinc-950 font-bold' : 'text-zinc-500'}`}
                >
                  INDIVIDUAL
                </button>
                <button
                  onClick={() => setChartMode('all')}
                  className={`px-2 py-1 ${chartMode === 'all' ? 'bg-amber-400 text-zinc-950 font-bold' : 'text-zinc-500'}`}
                >
                  ALL
                </button>
              </div>
            </div>

            {chartMode === 'individual' ? (
              <SimpleChart
                data={priceHistory}
                dataKey={selectedStock}
                color={stock.color}
                refLine={holdings[selectedStock] > 0 && avgCost[selectedStock] > 0 ? avgCost[selectedStock] : null}
                height={180}
              />
            ) : (
              <SimpleChart
                data={priceHistory}
                series={stockKeys
                  .filter(k => !hiddenSeries[k])
                  .map(k => ({
                    key: k,
                    color: activeStocks[k].color,
                    highlight: k === selectedStock
                  }))}
                height={180}
              />
            )}

            {/* 凡例(ALLモード時のみ) */}
            {chartMode === 'all' && (
              <div className="flex flex-wrap gap-1.5 px-2 mt-1.5">
                {stockKeys.map(k => {
                  const s = activeStocks[k];
                  const hidden = hiddenSeries[k];
                  const isSelected = k === selectedStock;
                  return (
                    <button
                      key={k}
                      onClick={() => setHiddenSeries(prev => ({ ...prev, [k]: !prev[k] }))}
                      className={`flex items-center gap-1.5 px-2 py-1 border text-[10px] transition-all ${
                        hidden ? 'border-zinc-800 opacity-40' : isSelected ? 'border-amber-400' : 'border-zinc-700'
                      }`}
                    >
                      <span
                        className="w-2 h-2 rounded-full"
                        style={{ backgroundColor: hidden ? '#3f3f46' : s.color }}
                      />
                      <span className={hidden ? 'text-zinc-600 line-through' : 'text-zinc-300'}>
                        {s.ticker}
                      </span>
                      <span className={`tabular-nums ${hidden ? 'text-zinc-700' : 'text-zinc-500'}`}>
                        ¥{prices[k].toFixed(0)}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>

          <div className="flex-1" />

          {/* 取引金額 */}
          <div className="px-4 py-2">
            <div className="text-[9px] tracking-widest text-zinc-500 mb-1.5">AMOUNT</div>
            <div className="grid grid-cols-4 gap-1.5">
              {[50000, 100000, 500000, 1000000].map(amt => (
                <button
                  key={amt}
                  onClick={() => setTradeAmount(amt)}
                  className={`py-2.5 text-xs font-bold border-2 ${
                    tradeAmount === amt
                      ? 'border-amber-400 text-amber-400 bg-amber-400/5'
                      : 'border-zinc-800 text-zinc-500'
                  }`}
                >
                  {amt / 10000}万
                </button>
              ))}
            </div>
          </div>

          {/* 投資・売却ボタン */}
          <div className="px-4 pb-24 pt-2">
            {flash && (
              <div className={`mb-2 text-xs text-center ${flash.error ? 'text-red-400' : 'text-amber-400'}`}>
                {flash.text}
              </div>
            )}
            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={handleBuy}
                className="py-5 bg-emerald-500 active:bg-emerald-600 text-zinc-950 font-black tracking-widest text-base"
              >
                ▲ 投資
              </button>
              <button
                onClick={handleSell}
                disabled={holdings[selectedStock] <= 0}
                className="py-5 bg-red-500 active:bg-red-600 text-zinc-950 font-black tracking-widest text-base disabled:bg-zinc-800 disabled:text-zinc-600"
              >
                ▼ 売却
              </button>
            </div>
          </div>

          {/* スワイプヒント */}
          {!newsPanelOpen && (
            <div className="absolute right-0 top-1/2 -translate-y-1/2 text-zinc-700 text-[9px] pr-1" style={{ writingMode: 'vertical-rl' }}>
              ← SWIPE FOR NEWS
            </div>
          )}

          {/* 強制ニューストースト */}
          {toast && (
            <div
              className="fixed top-3 left-3 right-3 z-40 pointer-events-auto"
              onClick={() => setToast(null)}
              style={{ animation: 'toastIn 0.3s ease-out' }}
            >
              <div className={`p-3 border-l-4 backdrop-blur-md shadow-2xl ${
                toast.isMarket
                  ? (toast.positive ? 'bg-emerald-950/95 border-emerald-400' : 'bg-red-950/95 border-red-500')
                  : toast.positive ? 'bg-zinc-900/95 border-emerald-400' : 'bg-zinc-900/95 border-red-500'
              }`}>
                <div className="flex items-start gap-2">
                  <div className="flex-1 min-w-0">
                    <div className={`text-[9px] tracking-widest mb-1 ${toast.positive ? 'text-emerald-400' : 'text-red-400'}`}>
                      {toast.isMarket ? '// MARKET ALERT' : '// BREAKING NEWS'}
                    </div>
                    <div className="text-xs text-zinc-100 leading-relaxed">
                      {toast.text}
                    </div>
                  </div>
                  <span className="text-zinc-600 text-xs">✕</span>
                </div>
              </div>
            </div>
          )}

          {/* ニュースサイドパネル */}
          <div
            className={`fixed inset-0 z-50 transition-opacity ${newsPanelOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
          >
            <div
              className="absolute inset-0 bg-black/60"
              onClick={() => setNewsPanelOpen(false)}
            />
            <div
              className={`absolute right-0 top-0 bottom-0 w-[85%] max-w-sm bg-zinc-950 border-l-2 border-amber-400 transition-transform ${newsPanelOpen ? 'translate-x-0' : 'translate-x-full'}`}
            >
              <div className="p-4 border-b border-zinc-800 flex justify-between items-center">
                <div>
                  <div className="text-[10px] tracking-widest text-amber-400">NEWS FEED</div>
                  <div className="text-lg font-black">市場速報</div>
                </div>
                <button
                  onClick={() => setNewsPanelOpen(false)}
                  className="w-10 h-10 border-2 border-zinc-800 flex items-center justify-center text-zinc-400"
                >
                  ✕
                </button>
              </div>
              <div className="p-4 space-y-2 overflow-y-auto" style={{ maxHeight: 'calc(100vh - 80px)' }}>
                {news.length === 0 && (
                  <div className="text-zinc-600 text-xs text-center py-8">市場の動きを待っています...</div>
                )}
                {news.map(n => (
                  <div key={n.id} className={`text-xs p-3 border-l-2 ${n.isMarket ? 'border-amber-400 bg-amber-400/5' : n.positive ? 'border-emerald-400 bg-emerald-400/5' : 'border-red-500 bg-red-500/5'}`}>
                    <div className="text-[10px] text-zinc-500 mb-1">TICK {n.tick}</div>
                    <div className="text-zinc-200 leading-relaxed">{n.text}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===== マウント =====
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TradeGame />);

    // ローディング非表示
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  </script>

  <!-- グローバルエラー捕捉(画面に表示) -->
  <script>
    window.addEventListener('error', function(e) {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.innerHTML = '<div style="color:#ef4444;text-align:left;padding:20px;font-size:11px;line-height:1.6;font-family:monospace;max-width:90%;">' +
          '<div style="color:#fbbf24;margin-bottom:10px;">// SYSTEM ERROR</div>' +
          (e.message || String(e)) +
          (e.filename ? '<br>at: ' + e.filename + ':' + e.lineno : '') +
          '</div>';
      }
    });
  </script>
</body>
</html>
